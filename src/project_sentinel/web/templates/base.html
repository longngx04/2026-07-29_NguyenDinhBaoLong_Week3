<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Project Sentinel{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="commandbar">
    <a class="mark" href="/">
      <span class="mark-glyph" aria-hidden="true"></span>
      <span>SENTINEL</span>
      <span class="mark-sub">SAST · DAST · triage</span>
    </a>

    <nav class="cmdnav" aria-label="Điều hướng chính">
      <a href="/" {% if nav == 'console' %}aria-current="page"{% endif %}>Bảng điều khiển</a>
      <a href="/history" {% if nav == 'history' %}aria-current="page"{% endif %}>Lịch sử chạy</a>
      <a href="/approvals" {% if nav == 'approvals' %}aria-current="page"{% endif %}>Hàng chờ duyệt<span id="gate-count"></span></a>
    </nav>

    <form method="post" action="/runs">
      <button type="submit" class="btn btn-run">▶ Chạy quét</button>
    </form>
  </header>

  <main class="shell">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/sentinel.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
